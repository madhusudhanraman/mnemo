<main><small>MNEMO / A LITTLE SPIRIT</small><h1>A little presence.<br>A gentle reminder.</h1><p>Soft fabric, a rippling hem, and the occasional happy spin. Drag your companion anywhere.</p><div><button id="remind">My reminders</button></div></main>

let lastRender=-Infinity,renderVisible=true,nativeVisible=true,frameQueued=false,renderTimer=null,needsRender=true;
function invalidateRender(){needsRender=true;requestRender()}
function requestRender(){if(!renderVisible||frameQueued||desktop?.mode==='manager')return;frameQueued=true;requestAnimationFrame(now=>{frameQueued=false;frame(now)})}
function scheduleFrame(){if(!renderVisible||paused||settled())return;clearTimeout(renderTimer);renderTimer=setTimeout(requestRender,Math.max(0,frameInterval()-(performance.now()-lastRender)))}
function frameInterval(){const active=dragging||time-announcementStart<3.5||mood.flutter>.001;return active?1000/30:mood.sleep>.85&&!(performance.now()<stirEnd)?1000/(desktop?.debug?.sleepyFPS??10):1000/(desktop?.debug?.idleFPS??20)}
function updateRenderVisibility(){const wasVisible=renderVisible;renderVisible=nativeVisible&&!document.hidden;if(!renderVisible){clearTimeout(renderTimer);return}if(!wasVisible){last=performance.now();lastRender=-Infinity;invalidateRender()}}
function frame(now){if(desktop?.mode==='manager'||!renderVisible)return;if(paused&&!needsRender)return;const interval=frameInterval();if(!needsRender&&now-lastRender<interval-.5){scheduleFrame();return}lastRender=now;needsRender=false;const dt=Math.min((now-last)/1000,.1);last=now;
const restful=desktop&&!paused&&!dragging&&!hovering&&!activeThoughtPersistent&&userIsInactive()&&mood.sleep>.97&&time-announcementStart>=3.5&&mood.flutter<=.001&&time-spinStart>=3.8&&peekabooReturn===Infinity;
const stirring=restful&&now<stirEnd,afterStir=stirEnd>0&&!stirring;
if(!restful)stillness-=dt/.6;else if(stirring)stillness=Math.max(0,stillness-dt/.7);else stillness+=dt/(afterStir?2:4);
stillness=Math.max(0,Math.min(1,stillness));
if(!restful)stopDoze();
// A stir runs the sleepy cloth at about awake speed; the gain only changes while he is still.
if(!paused)time+=dt*(1-stillness*stillness*(3-2*stillness))*(stirEnd>0?2.4:1);
if(!paused&&!dragging&&!hovering){const k=1-Math.exp(-dt*1.1);position.x+=(target.x-position.x)*k;position.y+=(target.y-position.y)*k;if(Math.hypot(target.x-position.x,target.y-position.y)<3)swimming=false;if(mood.sleep<.2&&!activeThoughtPersistent&&time>nextAdventure&&peekabooReturn===Infinity&&companion.visibility>.9999&&time-spinStart>=3.8){if(desktop){const choice=Math.random();if(choice<.35)spin();else if(choice<.65)behaviours.curious()}else{Math.random()<.35?spin():swim()}nextAdventure=time+90+Math.random()*90}}
if(desktop&&!paused&&!dragging&&!hovering&&!activeThoughtPersistent){idleClock+=dt*mood.speed;wander=idleOffset(idleClock)}
const t=time;draw(t);pet.style.transform=`translate(${position.x+(desktop?wander.x:0)}px,${position.y+(desktop?wander.y:(dragging?0:Math.sin(t*1.15)*7))}px)`;positionBubble();reportHitRegions(now);scheduleFrame();if(settled()){startDoze();if(!stirTimer)scheduleStir()}}
window.addEventListener('mnemo-visible',event=>{nativeVisible=Boolean(event.detail);updateRenderVisibility()});
addEventListener('visibilitychange',updateRenderVisibility);
window.addEventListener('pointermove',()=>{if(dragging)invalidateRender()});
/* START_REMINDERS */
requestRender();
</script>
